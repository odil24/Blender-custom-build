name: Build Blender Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную из интерфейса GitHub Actions

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: v5.2.0
          lfs: false        # Отключено во избежание ошибок 404, если LFS-файлы тега отсутствуют на публичном сервере
          submodules: recursive

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize Blender Build Environment & Dependencies
        shell: pwsh
        run: |
          Write-Host "Запуск подготовки зависимостей Blender..."
          # Blender использует python-скрипт update.py или make.py для загрузки библиотек и настройки
          if (Test-Path "build_files\build_environment") {
              Set-Location "build_files\build_environment"
              python windows_install_deps.py
          } else {
              # Альтернативный путь для актуальных версий
              python build_files/utils/make_update.py
          }

      - name: Generate Project Files with CMake
        shell: cmd
        run: |
          # Создание папки сборки и генерация решения
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build Blender
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%
