name: Build Custom Blender (Full Official Features)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Official Blender Repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          github-server-url: https://projects.blender.org
          ref: v5.2.0
          lfs: false
          submodules: recursive

      - name: Checkout My Custom Patches Repository
        uses: actions/checkout@v4
        with:
          repository: odil24/Blender-custom-build
          token: ${{ secrets.GITHUB_TOKEN }}
          path: temp_my_repo

      - name: Apply Custom Patches over Blender
        shell: pwsh
        run: |
          Write-Host "Checking patch folder..."
          $patchFolder = "temp_my_repo/my_patches"
          
          if (Test-Path $patchFolder) {
              Write-Host "Copying and overwriting files over Blender..."
              Copy-Item -Path "$patchFolder/*" -Destination "." -Recurse -Force
              Write-Host "Custom files successfully applied!"
          } else {
              Write-Host "my_patches folder not found. Building without patches."
          }

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.8'
          exit-on-failure: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize Build Environment & Dependencies
        shell: pwsh
        run: |
          Write-Host "Running Blender dependencies update script..."
          if (Test-Path "build_files/utils/make_update.py") {
              python build_files/utils/make_update.py
          } elseif (Test-Path "build_files\build_environment") {
              Set-Location "build_files\build_environment"
              python windows_install_deps.py
          } else {
              Write-Host "Standard initialization script not found, check repository structure."
          }

      - name: Generate Project Files with CMake (VS 2022)
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -C "../build_files/cmake/config/blender_release.cmake" ^
            -DWITH_CYCLES_CUDA_BINARIES=ON ^
            -DWITH_CYCLES_DEVICE_CUDA=ON ^
            -DWITH_CYCLES_DEVICE_OPTIX=ON ^
            -DWITH_CYCLES_DEVICE_HIP=ON ^
            -DWITH_CYCLES_DEVICE_ONEAPI=ON ^
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler"
      - name: Build Blender (Release)
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Package Blender Installation
        shell: cmd
        run: |
          cd build
          cmake --install . --config Release --prefix install_output

      - name: Archive Blender Build to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/install_output/*" -DestinationPath "blender-5.2-LTS-windows-x64.zip" -Force

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.2.0-custom-${{ github.run_number }}
          name: Blender 5.2 LTS Custom Build #${{ github.run_number }}
          files: |
            blender-5.2.4-windows-x64.zip
          body: "Automated custom build of Blender 5.2 LTS with user patches and full GPU rendering support (CUDA, OptiX, HIP, oneAPI)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
