name: Build Custom Blender (Full Official Features)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Official Blender Repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          github-server-url: https://projects.blender.org
          ref: blender-v5.2-release
          lfs: True
          submodules: recursive

      - name: Extract Blender Version
        shell: pwsh
        run: |
          $headerFile = "source/blender/blenkernel/BKE_blender_version.h"
          Write-Host "Reading version from $headerFile..."
          
          $major = (Select-String -Path $headerFile -Pattern '#define BLENDER_VERSION_MAJOR\s+(\d+)').Matches.Groups[1].Value
          $minor = (Select-String -Path $headerFile -Pattern '#define BLENDER_VERSION_MINOR\s+(\d+)').Matches.Groups[1].Value
          $patch = (Select-String -Path $headerFile -Pattern '#define BLENDER_VERSION_PATCH\s+(\d+)').Matches.Groups[1].Value
          
          $version = "$major.$minor.$patch"
          Write-Host "Detected Blender Version: $version"
          
          # Сохраняем версию в переменную окружения для следующих шагов
          "BLENDER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout My Custom Patches Repository
        uses: actions/checkout@v4
        with:
          repository: odil24/Blender-custom-build
          token: ${{ secrets.GITHUB_TOKEN }}
          path: temp_my_repo

      - name: Apply Custom Patches over Blender
        shell: pwsh
        run: |
          Write-Host "Checking patch folder..."
          $patchFolder = "temp_my_repo/my_patches"
          
          if (Test-Path $patchFolder) {
              Write-Host "Copying and overwriting files over Blender..."
              Copy-Item -Path "$patchFolder/*" -Destination "." -Recurse -Force
              Write-Host "Custom files successfully applied!"
          } else {
              Write-Host "my_patches folder not found. Building without patches."
          }

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.8.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
     
      - name: Cache Blender Dependencies and Build
        uses: actions/cache@v4
        with:
          path: |
            lib
            build
          key: ${{ runner.os }}-blender-v${{ env.BLENDER_VERSION }}-${{ hashFiles('build_files/cmake/platform/platform_win32.cmake') }}
          restore-keys: |
            ${{ runner.os }}-blender-v${{ env.BLENDER_VERSION }}-
      
      - name: Initialize Build Environment & Dependencies
        shell: cmd
        run: |
          echo y| call make.bat update
          
      - name: Generate Project Files with CMake (VS 2022)
        shell: cmd
        run: |
          if not exist build mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -C "../build_files/cmake/config/blender_release.cmake" ^
            -DWITH_CYCLES_CUDA_BINARIES=ON ^
            -DWITH_CYCLES_DEVICE_CUDA=ON ^
            -DWITH_CYCLES_DEVICE_OPTIX=ON ^
            -DWITH_CYCLES_DEVICE_HIP=ON ^
            -DWITH_CYCLES_DEVICE_ONEAPI=ON ^
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler"

      - name: Build Blender (Release)
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Package Blender Installation
        shell: cmd
        run: |
          cd build
          cmake --install . --config Release --prefix install_output

      - name: Archive Blender Build to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/install_output/*" -DestinationPath "blender-${{ env.BLENDER_VERSION }}-windows-x64.zip" -Force

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BLENDER_VERSION }}-custom-${{ github.run_number }}
          name: Blender ${{ env.BLENDER_VERSION }} LTS Custom Build #${{ github.run_number }}
          files: |
            blender-${{ env.BLENDER_VERSION }}-windows-x64.zip
          fail_on_unmatched_files: true
          body: "Blender ${{ env.BLENDER_VERSION }} LTS official with custom patches and full GPU rendering support (CUDA, OptiX, HIP, oneAPI)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
