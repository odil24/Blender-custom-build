name: Build Custom Blender (Full Official Features, MSVC + Ninja)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360 # Защита от бесконечного зависания

    steps:
      - name: Checkout Official Blender Repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          github-server-url: https://projects.blender.org
          ref: blender-v5.2-release
          lfs: True
          submodules: recursive

      # Автоматическое определение версии Blender
      - name: Extract Blender Version
        shell: pwsh
        run: |
          $headerFile = "source/blender/blenkernel/BKE_blender_version.h"
          
          if (-not (Test-Path $headerFile)) {
              Write-Error "Header file not found: $headerFile"
              exit 1
          }
          
          $content = Get-Content $headerFile -Raw
          $versionMatch = [regex]::Match($content, '#define\s+BLENDER_VERSION\s+(\d+)')
          $patchMatch = [regex]::Match($content, '#define\s+BLENDER_VERSION_PATCH\s+(\d+)')
          
          if (-not $versionMatch.Success -or -not $patchMatch.Success) {
              Write-Error "Could not parse version macros from $headerFile"
              exit 1
          }
          
          $versionCode = [int]$versionMatch.Groups[1].Value
          $major = [math]::Floor($versionCode / 100)
          $minor = $versionCode % 100
          $patch = [int]$patchMatch.Groups[1].Value
          
          $version = "$major.$minor.$patch"
          Write-Host "Detected Blender Version: $version"
          
          "BLENDER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout My Custom Patches Repository
        uses: actions/checkout@v4
        with:
          repository: odil24/Blender-custom-build
          token: ${{ secrets.GITHUB_TOKEN }}
          path: temp_my_repo

      - name: Apply Custom Patches over Blender
        shell: pwsh
        run: |
          Write-Host "Checking patch folder..."
          $patchFolder = "temp_my_repo/my_patches"
          
          if (Test-Path $patchFolder) {
              Write-Host "Copying and overwriting files over Blender..."
              Copy-Item -Path "$patchFolder/*" -Destination "." -Recurse -Force
              Write-Host "Custom files successfully applied!"
          } else {
              Write-Host "my_patches folder not found. Building without patches."
          }

      # -----------------------------------------------------------------------
      # Ninja больше не предустановлен в windows-2022 (с ~сент. 2023).
      # Устанавливаем явно через Chocolatey.
      # -----------------------------------------------------------------------
      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              Write-Host "Installing Ninja via Chocolatey..."
              choco install ninja -y --no-progress
          } else {
              Write-Host "Ninja already available."
          }
          $ninjaPath = (Get-Command ninja).Source
          Write-Host "Using Ninja at: $ninjaPath"
          ninja --version

      # -----------------------------------------------------------------------
      # MSVC-окружение: компилятор cl.exe, линкер, Windows SDK, хост CUDA.
      # -----------------------------------------------------------------------
      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.8.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Клонирование официального репозитория NVIDIA optix-dev
      - name: Clone OptiX Dev Headers
        shell: pwsh
        run: |
          $optixDevPath = "C:\optix-dev"
          Write-Host "Cloning NVIDIA optix-dev repository..."
          git clone --depth 1 --branch v8.0.0 https://github.com/NVIDIA/optix-dev.git $optixDevPath
          
          if (Test-Path "$optixDevPath\include") {
              Write-Host "OptiX headers cloned successfully."
              "OPTIX_ROOT_DIR=$optixDevPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
              Write-Error "Failed to find include directory in cloned optix-dev repo."
              exit 1
          }

      - name: Initialize Build Environment & Dependencies
        shell: cmd
        run: |
          echo y| call make.bat update

      # -----------------------------------------------------------------------
      # CMake + Ninja + MSVC.
      # Ninja — single-config генератор, поэтому CMAKE_BUILD_TYPE обязателен.
      # CMAKE_INSTALL_PREFIX задаётся здесь (вместо --prefix при install).
      # -----------------------------------------------------------------------
      - name: Generate Project Files with CMake (Ninja + MSVC)
        shell: cmd
        run: |
          if not exist build mkdir build
          cd build
          cmake .. -G Ninja ^
            -C "../build_files/cmake/config/blender_release.cmake" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=install_output ^
            -DWITH_CYCLES_CUDA_BINARIES=ON ^
            -DWITH_CYCLES_DEVICE_CUDA=ON ^
            -DWITH_CYCLES_DEVICE_OPTIX=ON ^
            -DOPTIX_ROOT_DIR="${{ env.OPTIX_ROOT_DIR }}" ^
            -DWITH_CYCLES_DEVICE_HIP=ON ^
            -DWITH_CYCLES_DEVICE_ONEAPI=ON ^
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler"

      - name: Build Blender (Release, Ninja)
        shell: cmd
        run: |
          cd build
          ninja

      - name: Package Blender Installation
        shell: cmd
        run: |
          cd build
          ninja install

      - name: Archive Blender Build to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/install_output/*" -DestinationPath "blender-${{ env.BLENDER_VERSION }}-windows-x64.zip" -Force

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BLENDER_VERSION }}-custom-${{ github.run_number }}
          name: Blender ${{ env.BLENDER_VERSION }} LTS Custom Build #${{ github.run_number }}
          files: |
            blender-${{ env.BLENDER_VERSION }}-windows-x64.zip
          fail_on_unmatched_files: true
          body: "Automated custom build of Blender ${{ env.BLENDER_VERSION }} LTS with user patches and full GPU rendering support (CUDA, OptiX, HIP, oneAPI). Built with MSVC + Ninja."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
