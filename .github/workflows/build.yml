name: Build Blender from Official Source

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout Official Blender Repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          # Указываем официальный хост, если actions/checkout по умолчанию смотрит на GitHub
          github-server-url: https://projects.blender.org
          ref: v5.2.0
          lfs: false        # Отключаем LFS на случай, если тег содержит бинарники, отсутствующие на публичных серверах
          submodules: recursive

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize Build Environment & Dependencies
        shell: pwsh
        run: |
          Write-Host "Запуск скрипта обновления зависимостей Blender..."
          if (Test-Path "build_files/utils/make_update.py") {
              python build_files/utils/make_update.py
          } elseif (Test-Path "build_files\build_environment") {
              Set-Location "build_files\build_environment"
              python windows_install_deps.py
          } else {
              Write-Host "Не найден стандартный скрипт инициализации, проверьте структуру репозитория."
          }

      - name: Generate Project Files with CMake
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build Blender (Release)
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%
