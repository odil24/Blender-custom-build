name: Build Blender 5.2 Win64 CUDA

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Install Ninja via Chocolatey
        run: |
          choco install ninja -y
        shell: powershell

      - name: Checkout Blender Source & Submodules (with Git LFS)
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: v5.2.0
          submodules: recursive
          lfs: true # КРИТИЧНО: включаем загрузку больших файлов (LFS)
          path: blender

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.2.0'

      - name: Configure CMake (MSVC / Visual Studio 2022)
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -DWITH_CYCLES_CUDA_BINARIES=ON ^
            -DWITH_BUILD_INFO=ON ^
            -DWITH_PYTHON_INSTALL=OFF
        working-directory: ./blender
        shell: cmd

      - name: Build Blender
        run: |
          cd build
          cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%
        working-directory: ./blender
        shell: cmd

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.2-windows-x64-cuda
          path: blender/build/bin/Release/
